name: Desktop Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows portable zip
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows portable package
        run: npm run desktop:package:windows

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: pixelaid-windows-portable
          path: artifacts/desktop/*windows*-portable.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS app zip
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned macOS app package
        run: npm run desktop:package:macos

      - name: Upload macOS app package
        uses: actions/upload-artifact@v4
        with:
          name: pixelaid-macos-app
          path: artifacts/desktop/*macos*-app.zip
          if-no-files-found: error
          retention-days: 14
