name: Desktop Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TELEMETRY_PROVIDER: ${{ vars.TELEMETRY_PROVIDER }}
  TELEMETRY_POSTHOG_PROJECT_KEY: ${{ secrets.TELEMETRY_POSTHOG_PROJECT_KEY }}
  TELEMETRY_POSTHOG_HOST: ${{ vars.TELEMETRY_POSTHOG_HOST }}
  TELEMETRY_ENABLED: ${{ vars.TELEMETRY_ENABLED }}
  TELEMETRY_BUILD_CHANNEL: ${{ vars.TELEMETRY_BUILD_CHANNEL }}

jobs:
  windows:
    name: Windows portable zip
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Show tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows portable package
        run: npm run desktop:package:windows
        env:
          TELEMETRY_DISTRIBUTION: desktop_windows_portable

      - name: Verify Windows package
        run: |
          $zip = Get-ChildItem artifacts/desktop/*windows*-portable.zip | Select-Object -First 1
          if (-not $zip) {
            throw "No Windows portable zip found."
          }

          tar -tf $zip.FullName

          $extractDir = Join-Path $env:RUNNER_TEMP "pixelaid-windows"
          if (Test-Path $extractDir) {
            Remove-Item -Recurse -Force $extractDir
          }
          New-Item -ItemType Directory -Path $extractDir | Out-Null
          tar -xf $zip.FullName -C $extractDir

          node apps/desktop/scripts/verify-desktop-package.mjs windows $extractDir

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v7
        with:
          name: pixelaid-windows-portable
          path: artifacts/desktop/*windows*-portable.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS app zip (arm64)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Show tool versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          uname -m

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned macOS app package
        run: npm run desktop:package:macos -- --arch arm64
        env:
          TELEMETRY_DISTRIBUTION: desktop_macos_app

      - name: Verify macOS package
        run: |
          zip="$(find artifacts/desktop -name '*macos*-arm64-app.zip' -print -quit)"
          if [ -z "$zip" ]; then
            echo "No macOS arm64 app zip found." >&2
            exit 1
          fi

          unzip -l "$zip"

          extract_dir="$RUNNER_TEMP/pixelaid-macos-arm64"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          ditto -x -k "$zip" "$extract_dir"

          node apps/desktop/scripts/verify-desktop-package.mjs macos "$extract_dir" arm64

      - name: Upload macOS app package
        uses: actions/upload-artifact@v7
        with:
          name: pixelaid-macos-arm64-app
          path: artifacts/desktop/*macos*-arm64-app.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
