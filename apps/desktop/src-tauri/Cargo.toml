[package]
name = "pixelaid-desktop"
version = "0.2.0"
description = "PixelAid desktop shell"
authors = ["PixelAid contributors"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "pixelaid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
